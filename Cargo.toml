[package]
name = "opensketcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A cross-platform desktop 3D modeling application"
license = "Apache-2.0"
publish = false

[dependencies]
eframe = { version = "=0.34.3", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
rfd = "0.17.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tempfile = "3.27.0"
truck-meshalgo = { version = "0.4", default-features = false, features = ["tessellation"] }
truck-modeling = "0.6"
truck-shapeops = { version = "0.4", default-features = false }
truck-stepio = { version = "0.3", default-features = false }
