name: Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libudev-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/OpenSketcher.app/Contents/MacOS
          cp target/release/opensketcher dist/OpenSketcher.app/Contents/MacOS/
          cp packaging/macos/Info.plist dist/OpenSketcher.app/Contents/
          ditto -c -k --keepParent dist/OpenSketcher.app dist/OpenSketcher-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: OpenSketcher-macOS
          path: dist/OpenSketcher-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: OpenSketcher-Windows
          path: target/release/opensketcher.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: OpenSketcher-Linux
          path: target/release/opensketcher
