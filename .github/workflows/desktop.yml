name: Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libudev-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo build --release
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/OpenSketcher.app/Contents/MacOS dist/OpenSketcher.app/Contents/Resources
          cp target/release/opensketcher dist/OpenSketcher.app/Contents/MacOS/
          cp packaging/macos/Info.plist dist/OpenSketcher.app/Contents/
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dist/OpenSketcher.app/Contents/Resources/
          ditto -c -k --keepParent dist/OpenSketcher.app dist/OpenSketcher-macOS.zip
      - name: Package Windows and Linux files
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dist/
          cp target/release/opensketcher${{ runner.os == 'Windows' && '.exe' || '' }} dist/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: OpenSketcher-macOS
          path: dist/OpenSketcher-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: OpenSketcher-Windows
          path: dist/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: OpenSketcher-Linux
          path: dist/

  # Checks report independently; packaging must not depend on their result.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libudev-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
